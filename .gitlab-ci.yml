stages:
- test
- pages
- deploy

test:
  stage: test
  image: python:3.9
  before_script:
  - pip install -r requirements-dev.txt
  script:
    pytest
  artifacts:
    expire_in: 1 day
  tags:
  - python

pages:
  stage: pages
  image: python:3.9
  before_script:
  - python3 -m pip install sphinx
  script:
    - python3 -m sphinx -b html docs/source public/
  artifacts:
    expire_in: 1 day
    paths:
      - public
  tags:
  - deploy
  only:
    - main

deploy:
  stage: deploy
  image: python:3.9
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
  - python3 -m pip install build
  script:
    - echo "deploying '$CI_COMMIT_TAG' to '$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH'"
    - python3 -m build --wheel
    - python3 -m build --wheel "-C=--build-option=--plat-name win32"
    - python3 -m build --wheel "-C=--build-option=--plat-name win_amd64"
    - echo '-----BEGIN OPENSSH PRIVATE KEY-----' > deploy_key
    - echo $DEPLOY_KEY | sed -r 's/-----(BEGIN|END) OPENSSH PRIVATE KEY----- ?//g' | sed 's/ /\n/g' >> deploy_key
    - echo '-----END OPENSSH PRIVATE KEY-----' >> deploy_key
    - echo '' >> deploy_key
    - chmod 600 deploy_key
    - cat deploy_key
    - ssh -v -o StrictHostKeyChecking=no -i deploy_key $DEPLOY_USER@$DEPLOY_HOST 'mkdir -p $DEPLOY_PATH/$CI_COMMIT_TAG'
    - scp -o StrictHostKeyChecking=no -i deploy_key dist/*.whl $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/$CI_COMMIT_TAG/
  artifacts:
    expire_in: 1 day
    paths:
      - dist
  tags:
  - deploy