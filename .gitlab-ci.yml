stages:
- test
- pages
- deploy

test:
  stage: test
  image: python:3.9
  variables:
    SILENT_PUSH_API_KEY: "$SILENT_PUSH_API_KEY"
  before_script:
  - pip install -r requirements-dev.txt
  script:
    pytest
  tags:
  - python

pages:
  stage: pages
  image: python:3.9
  before_script:
  - python3 -m pip install sphinx
  script:
    - python3 -m sphinx -b html docs/source public/
  artifacts:
    paths:
      - public
  tags:
  - deploy
  only:
    - main

deploy:
  stage: deploy
  image: python:3.9
  before_script:
  - python3 -m pip install build
  script:
    - python3 -m build --wheel
    - python3 -m build --wheel "-C=--build-option=--plat-name win32"
    - python3 -m build --wheel "-C=--build-option=--plat-name win_amd64"
    - echo "deploying to '$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH'"
    - echo $DEPLOY_KEY > deploy_key
    - chmod 600 deploy_key
    - cat deploy_key
    - scp -v -o StrictHostKeyChecking=no -i deploy_key dist/*.whl $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH
  artifacts:
    paths:
      - dist
  tags:
  - deploy
  only:
    - main