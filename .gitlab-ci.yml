stages:
- test
- pages
- deploy

test:
  stage: test
  image: python:3.9
  variables:
    SILENT_PUSH_API_KEY: "$SILENT_PUSH_API_KEY"
  before_script:
  - pip install -r requirements-dev.txt
  script:
    pytest
  tags:
  - python

pages:
  stage: pages
  image: python:3.9
  before_script:
  - python3 -m pip install sphinx
  script:
    - python3 -m sphinx -b html docs/source public/
  artifacts:
    paths:
      - public
  tags:
  - deploy
  only:
    - main

deploy:
  stage: deploy
  image: python:3.9
  before_script:
  - python3 -m pip install build
  script:
    - python3 -m build --wheel
  artifacts:
    paths:
      - dist
  tags:
  - deploy
  only:
    - main