stages:
- test
- pages
- deploy

test:
  stage: test
  image: python:3.9
  variables:
    SILENT_PUSH_API_KEY: "$SILENT_PUSH_API_KEY"
  before_script:
  - pip install -r requirements-dev.txt
  script:
    pytest
  tags:
  - python

pages:
  stage: pages
  image: python:3.9
  before_script:
  - python3 -m pip install sphinx
  script:
    - python3 -m sphinx -b html docs/source public/
  artifacts:
    paths:
      - public
  tags:
  - deploy
  only:
    - main

deploy:
  stage: deploy
  image: python:3.9
  before_script:
  - python3 -m pip install build
#  @TODO: we also need to build for Win32 and 64
  script:
    - python3 -m build --wheel
    - echo "deploying to '$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH'"
    - find /home/gitlab-runner/builds/ -name DEPLOY_KEY
    - ls -la /home/gitlab-runner/builds/
    - ls -la /home/gitlab-runner/builds/$CI_RUNNER_SHORT_TOKEN
    - ls -la /home/gitlab-runner/builds/$CI_RUNNER_SHORT_TOKEN/0/
    - echo $DEPLOY_KEY
    - chmod 600 /home/gitlab-runner/builds/$CI_RUNNER_SHORT_TOKEN/0/silentpush-app/client-api.tmp/DEPLOY_KEY
    - scp -v -o StrictHostKeyChecking=no -i $DEPLOY_KEY dist/*.whl $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH
  artifacts:
    paths:
      - dist
  tags:
  - deploy
  only:
    - main