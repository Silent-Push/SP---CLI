stages:
- test
- document

test:
  stage: test
  image: python:3.9
  variables:
    SILENT_PUSH_API_KEY: "$SILENT_PUSH_API_KEY"
  before_script:
  - pip install -r requirements-dev.txt
  script:
    pytest
  tags:
  - python

document:
  stage: document
  image: python:3.9
  script: |
    cd docs/source &
    make html
  artifacts:
    paths:
      - docs/build/html
  tags:
    - document
