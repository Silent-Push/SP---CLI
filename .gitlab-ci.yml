stages:
- test
- pages
- deploy

test:
  stage: test
  image: python:3.9
  variables:
    SILENT_PUSH_API_KEY: "$SILENT_PUSH_API_KEY"
  before_script:
  - pip install -r requirements-dev.txt
  script:
    pytest
  tags:
  - python

pages:
  stage: pages
  image: python:3.9
  before_script:
  - python3 -m pip install sphinx
  script:
    - python3 -m sphinx -b html docs/source public/
  artifacts:
    paths:
      - public
  tags:
  - deploy
  only:
    - main

deploy:
  variables:
    SECURE_FILES_DOWNLOAD_PATH: './tmp/'
  stage: deploy
  image: python:3.9
  before_script:
  - python3 -m pip install build
#  @TODO: we also need to build for Win32 and 64
  script:
    - python3 -m build --wheel
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - chmod 644 ./tmp/id_rsa_2
    - echo "deploying to '$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH'"
# @FIXME: Host key verification failed.
#    - scp -i ./tmp/id_rsa_2 dist/*.whl $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH
  artifacts:
    paths:
      - dist
      - ./tmp
  tags:
  - deploy
  only:
    - main