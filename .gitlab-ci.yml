stages:
- test
- pages
- deploy

test:
  stage: test
  image: python:3.9
  variables:
    SILENT_PUSH_API_KEY: "$SILENT_PUSH_API_KEY"
  before_script:
  - pip install -r requirements-dev.txt
  script:
    - echo $SILENT_PUSH_API_KEY
    - pytest
  tags:
  - python

pages:
  stage: pages
  image: python:3.9
  before_script:
  - python3 -m pip install sphinx
  script:
    - python3 -m sphinx -b html docs/source public/
  artifacts:
    expire_in: 1 day
    paths:
      - public
  tags:
  - deploy
  only:
    - main

deploy:
  stage: deploy
  image: python:3.9
  before_script:
  - python3 -m pip install build
  script:
    - echo "deploying to '$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH'"
    - python3 -m build --wheel
    - python3 -m build --wheel "-C=--build-option=--plat-name win32"
    - python3 -m build --wheel "-C=--build-option=--plat-name win_amd64"
    - echo '-----BEGIN OPENSSH PRIVATE KEY-----' > deploy_key
    - echo $DEPLOY_KEY | sed -r 's/-----(BEGIN|END) OPENSSH PRIVATE KEY----- ?//g' | sed 's/ /\n/g' >> deploy_key
    - echo '-----END OPENSSH PRIVATE KEY-----' >> deploy_key
    - chmod 600 deploy_key
    - scp -v -o StrictHostKeyChecking=no -i deploy_key dist/*.whl $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH
  artifacts:
    expire_in: 1 day
    paths:
      - dist
  tags:
  - deploy
  only:
    - main