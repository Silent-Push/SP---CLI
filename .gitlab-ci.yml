stages:
- test
- pages

test:
  stage: test
  image: python:3.9
  variables:
    SILENT_PUSH_API_KEY: "$SILENT_PUSH_API_KEY"
  before_script:
  - pip install -r requirements-dev.txt
  script:
    pytest
  tags:
  - python

pages:
  stage: pages
  image: python:3.9
  before_script:
  - python3 -m pip install sphinx
  script:
    - python3 -m pip install sphinx furo
    - sphinx-build -b html docs/source public/
  artifacts:
    paths:
      - public
  tags:
  - deploy
  only:
    - main